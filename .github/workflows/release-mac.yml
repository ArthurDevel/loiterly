name: Release macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS artifacts
        run: npm run dist:mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loiterly-macos-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-build-${GITHUB_RUN_NUMBER}}"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber
          else
            gh release create "$TAG_NAME" \
              dist/*.dmg \
              dist/*.zip \
              dist/*.blockmap \
              dist/latest-mac.yml \
              --generate-notes
          fi
