name: Release Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows artifacts
        run: npm run dist:win

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loiterly-windows-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }

          if (gh release view $tagName *> $null) {
            gh release upload $tagName dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          } else {
            gh release create $tagName dist/*.exe dist/*.blockmap dist/latest.yml --generate-notes
          }
        shell: pwsh
