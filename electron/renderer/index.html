<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loiterly</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand drag-region">
          <div class="brand-mark">▲</div>
          <div class="brand-copy">
            <strong>Loiterly</strong>
            <span>Chromium shell</span>
          </div>
        </div>

        <nav class="tiles">
          <button class="tile is-active" data-app="browser">
            <span class="tile-icon">◎</span>
            <span>Browser</span>
          </button>
          <button class="tile" data-app="notion">
            <span class="tile-icon">N</span>
            <span>Notion</span>
          </button>
          <button class="tile" data-app="github">
            <span class="tile-icon">G</span>
            <span>GitHub</span>
          </button>
          <button class="tile" data-app="github-issues">
            <span class="tile-icon">#</span>
            <span>Issues</span>
          </button>
          <button class="tile" data-app="linkedin">
            <span class="tile-icon">in</span>
            <span>LinkedIn</span>
            <span class="tile-badge" data-badge-for="linkedin" hidden></span>
          </button>
          <button class="tile" data-app="instagram">
            <span class="tile-icon">I</span>
            <span>Instagram</span>
          </button>
          <button class="tile" data-app="twitter">
            <span class="tile-icon">T</span>
            <span>Twitter</span>
          </button>
          <button class="tile" data-app="links">
            <span class="tile-icon">✦</span>
            <span>Links</span>
          </button>
          <button class="tile" data-app="conductor">
            <span class="tile-icon">◌</span>
            <span>Conductor</span>
            <span class="tile-badge" data-badge-for="conductor" hidden></span>
          </button>
        </nav>

        <div class="rail-meta">
          <div class="rail-footer">
            <div class="shortcut-label">Open / Close</div>
            <div id="global-shortcut" class="shortcut" aria-label="Open or close with Command Shift L"></div>
          </div>

          <section id="update-card" class="update-card no-drag" hidden>
            <div class="update-card__eyebrow">Install latest</div>
            <h2 id="update-title" class="update-card__title"></h2>
            <p id="update-detail" class="update-card__detail"></p>
            <button id="update-action" class="update-card__button" type="button"></button>
          </section>
        </div>
      </aside>

      <main class="main">
        <header class="toolbar drag-region">
          <div class="window-actions no-drag">
            <button id="hide-window" class="ghost-button" title="Hide window">Hide</button>
          </div>

          <div class="nav-controls no-drag">
            <button id="go-back" class="icon-button" aria-label="Back">←</button>
            <button id="go-forward" class="icon-button" aria-label="Forward">→</button>
            <button id="reload" class="icon-button" aria-label="Reload">↻</button>
          </div>

          <form id="address-form" class="address-form no-drag">
            <input id="address-input" type="text" autocomplete="off" spellcheck="false" placeholder="Enter a URL or search" />
          </form>

          <div class="page-meta">
            <div id="page-title">Loiterly Browser</div>
            <div id="page-status">Ready</div>
          </div>
        </header>

        <section id="issues-shortcuts" class="issues-shortcuts no-drag" hidden>
          <div class="issues-shortcuts__meta">
            <p class="issues-shortcuts__eyebrow">ArthurDevel</p>
            <div id="issues-shortcuts-status" class="issues-shortcuts__status">Repositories</div>
          </div>
          <div id="issues-shortcuts-list" class="issues-shortcuts__list"></div>
        </section>

        <section id="content-host" class="content-host">
          <div id="content-stage" class="content-stage" aria-hidden="true"></div>
        </section>
      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
